<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth">
  <form class="auth-box" id="f" autocomplete="off">
    <img src="/static/img/garuda.svg" alt="">
    <h1>M4ZK1PL4Y<em>SPY</em></h1>
    <p>Command &amp; Control Console</p>
    <div class="field"><label>LICENSE KEY</label>
      <input class="inp" id="lic" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
        style="height:33px;letter-spacing:.28em;text-transform:uppercase" autofocus></div>
    <div class="auth-err" id="err"></div>
    <button class="btn acc" id="go" style="width:100%;height:33px">MASUK</button>
    <div class="auth-foot">v2.1.0 &middot; PIN 211421</div>
  </form>
</div>
<div class="toast-wrap" id="tw"></div>
<script type="module">
import { $, toast } from '/static/js/core.js';
import { rippleInit } from '/static/js/ui.js';
rippleInit(document);
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const lic = $('#lic').value.trim();
  if (!lic) return;
  $('#go').disabled = true;
  $('#err').textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ license: lic }),
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.message || 'license ditolak');
    location.href = d.redirect || '/dashboard';
  } catch (err) {
    $('#err').textContent = err.message;
    $('#go').disabled = false;
    toast(err.message, 'wn');
  }
});
</script>
</body>
</html>
