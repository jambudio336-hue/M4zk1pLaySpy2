<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="overflow:auto">
<div class="pa">
  <h1>AGENT BRIDGE</h1>
  <div class="sub">iOS Web Clip &amp; pairing manual</div>
  <div class="card"><div class="card-b">
    <div class="field"><label>TOKEN PAIRING</label>
      <input class="inp" id="tk" placeholder="token dari QR"></div>
    <button class="btn acc" id="go" style="width:100%;height:31px">BUKA AGENT</button>
    <div class="dim" style="font-size:8.5px;margin-top:8px;line-height:1.7">
      Di iPhone: buka halaman ini di Safari, tekan Share &rarr; Add to Home Screen,
      lalu jalankan. Beacon tetap hidup selama app di latar depan.
    </div>
  </div></div>
</div>
<script>
document.getElementById('go').onclick = function () {
  var t = document.getElementById('tk').value.trim();
  if (t) location.href = '/p/' + t;
};
</script>
</body>
</html>
