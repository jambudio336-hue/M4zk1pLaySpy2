<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dumps</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="win" id="win"></div>
<div class="toast-wrap" id="tw"></div>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div>
<script type="module">
import { $, api, del, toast, esc, fmt, jitter } from '/static/js/core.js';
import { chrome, statusbar, svg, confirmBox } from '/static/js/ui.js';
import { connect, on } from '/static/js/ws.js';

const win = $('#win');
chrome(win, {
  page: 'dumps', title: 'Dumps',
  actions: [
    '<button class="tbtn" id="rf">' + svg('reload') + 'REFRESH</button>',
    '<button class="tbtn" id="purge">' + svg('wipe') + 'PURGE</button>',
  ],
});
const body = document.createElement('div');
body.className = 'body pad';
win.appendChild(body);
statusbar(win, '<span class="st"><b>&#9679;</b> ARSIP</span><span class="st" id="tot">0 B</span>' +
  '<span class="st-r">v2.1.0</span>');

body.innerHTML = `
<div class="card"><div class="card-h">${svg('dumps')}SEMUA HASIL DUMP<span class="spacer"></span>
  <select class="inp" id="kind" style="height:19px;width:118px;font-size:8.5px">
    <option value="">SEMUA JENIS</option>
  </select></div>
  <div style="overflow:auto"><table class="tbl">
    <thead><tr><th>Jenis</th><th>Target</th><th>File</th><th>Ukuran</th><th>Waktu</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table></div></div>`;

async function list() {
  try {
    const k = $('#kind').value;
    const d = await api('/api/dumps' + (k ? '?kind=' + encodeURIComponent(k) : ''));
    $('#tot').textContent = fmt.bytes(d.total_size);
    $('#rows').innerHTML = d.dumps.map((x) =>
      '<tr><td><span class="tag">' + esc(x.kind) + '</span></td>' +
      '<td><a href="/targets?t=' + esc(x.target_id) + '">' + esc(x.model || x.target_id) + '</a></td>' +
      '<td class="mono">' + esc(x.filename) + '</td><td>' + fmt.bytes(x.size) + '</td>' +
      '<td class="dim">' + fmt.date(x.created) + '</td>' +
      '<td><button class="btn xs ghost" data-p="' + esc(x.id) + '">LIHAT</button>' +
      '<a class="btn xs ok" href="/api/dumps/' + esc(x.id) + '/download">UNDUH</a>' +
      '<button class="btn xs danger" data-d="' + esc(x.id) + '">&times;</button></td></tr>').join('')
      || '<tr><td colspan="6" class="empty">belum ada hasil</td></tr>';

    document.querySelectorAll('[data-d]').forEach((b) => {
      b.onclick = async () => {
        if (!await confirmBox('HAPUS DUMP', 'Hapus file ini dari disk?')) return;
        await del('/api/dumps/' + b.dataset.d);
        list();
        toast('Dihapus.', 'ok');
      };
    });
    document.querySelectorAll('[data-p]').forEach((b) => {
      b.onclick = () => preview(b.dataset.p, d.dumps.find((x) => x.id === b.dataset.p));
    });
  } catch {}
}

function preview(id, meta) {
  const f = (meta.filename || '').toLowerCase();
  const src = '/api/dumps/preview/' + id;
  let inner = '<iframe src="' + src + '" style="width:100%;height:58vh;border:0;background:#000"></iframe>';
  if (/\.(jpg|jpeg|png|webp|gif)$/.test(f))
    inner = '<img src="' + src + '" style="max-width:100%;max-height:58vh;display:block;margin:auto">';
  if (/\.(mp4|webm)$/.test(f))
    inner = '<video src="' + src + '" controls style="width:100%;max-height:58vh"></video>';
  if (/\.(m4a|mp3|ogg|wav)$/.test(f))
    inner = '<audio src="' + src + '" controls style="width:100%"></audio>';
  $('#dlg').innerHTML = '<div class="dlg-h">' + svg('file') + esc(meta.filename || 'preview') +
    '<span class="x">&times;</span></div><div class="dlg-b" style="padding:0">' + inner + '</div>' +
    '<div class="dlg-f"><a class="btn acc" href="/api/dumps/' + id + '/download">UNDUH</a></div>';
  $('#mask').classList.add('on');
  $('#dlg .x').onclick = () => $('#mask').classList.remove('on');
  $('#mask').onclick = (e) => { if (e.target === $('#mask')) $('#mask').classList.remove('on'); };
}

$('#purge').onclick = async () => {
  if (!await confirmBox('PURGE DUMP', 'Hapus SEMUA file dump dari disk?')) return;
  await api('/api/admin/purge/dumps', { method: 'POST' });
  toast('Semua dump dihapus.', 'ok');
  list();
};
$('#rf').onclick = list;
$('#kind').onchange = list;
on('dump', list);
connect();
list();
setInterval(list, jitter(14000, 5000));
</script>
</body>
</html>
